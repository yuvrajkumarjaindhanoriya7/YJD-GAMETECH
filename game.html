<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YJD GameTech demo</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
.iframe-container{position:relative;width:100%;height:100%;overflow:hidden}
#myIframe{width:100%;height:100%;border:none;transition:opacity .2s}
.hud{position:absolute;right:10px;top:10px;font:12px ui-monospace,Menlo,monospace;color:#fff;background:rgba(0,0,0,.6);padding:5px 9px;border-radius:6px;pointer-events:none}
.hud span{color:#ffd84a}
@media (max-width:520px){.hud{font-size:10px;right:6px;top:6px;padding:3px 6px}}
</style>
</head>
<body>
<div class="iframe-container">
  <iframe src="street.html" id="myIframe" title="Game world"></iframe>
  <div class="hud">time: <span id="t">day</span> · stateone: <span id="s">false</span></div>
</div>
<script src="engine.js"></script>
<script>
setInterval(()=>{ document.getElementById('t').textContent=getGameTime(); document.getElementById('s').textContent=getGameState(); },250);
</script>
</body>
</html>
